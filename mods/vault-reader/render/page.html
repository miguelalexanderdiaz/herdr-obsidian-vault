<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data: blob:; img-src 'self' data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<style>

<script>
  // As Obsidian sets MathJax up (app.js), plus a flag when it's ready.
  window.MathJax = {
    tex: { inlineMath: [], displayMath: [], processEscapes: false, processEnvironments: false, processRefs: false },
    startup: { typeset: false, ready() { MathJax.startup.defaultReady(); MathJax.startup.promise.then(() => { window.mathReady = true; }); } },
    options: { enableMenu: false, renderActions: { assistiveMml: [] } },
  };
</script>
