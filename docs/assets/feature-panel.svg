<title id="t">The Vault panel: the vault picker open, and a search</title>
<desc id="d">Two views of the Vault panel on the sample vault. Left: the vault picker is open under the header, listing sample-vault (checked) with its folder, then Add vault… and Import from Obsidian; the file tree shows below it. Right: the search box holds &quot;tour&quot; and the results replace the tree: Feature tour. Drawn from the mods' own layout code, icons and the Herdr graphite theme, with the sample vault's content; a drawing, not a screenshot.</desc>
