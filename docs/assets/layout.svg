<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13">
<title id="t">Schematic of the Vault panel next to the floating Vault reader. Not a screenshot.</title>
<desc id="d">A drawing, not a screenshot. On the left a narrow panel: a vault picker showing sample-vault, a search box, and a file tree with the folders attachments and projects, then the notes Board, Feature tour (selected), Flow sketch and Other note. On the right a floating reader window titled Feature tour, with Back, Web images and Keep buttons, a heading, a callout, a small Mermaid diagram and a math formula.</desc>
<style>
:root { --bg:#181616; --surface:#282727; --fg:#c5c9c5; --muted:#a6a69c; --border:#393836; --code-bg:#12120f; --accent:#b6927b; --accent-fg:#181616; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#181616; --surface:#282727; --fg:#c5c9c5; --muted:#a6a69c; --border:#393836; --code-bg:#12120f; --accent:#b6927b; --accent-fg:#181616; }
}
.bg { fill: var(--bg); }
.surface { fill: var(--surface); }
.code { fill: var(--code-bg); }
.line { fill: none; stroke: var(--border); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.sel { fill: var(--accent); }
.fg { fill: var(--fg); }
.mu { fill: var(--muted); }
.onaccent { fill: var(--accent-fg); }
.ring { fill: none; stroke: var(--accent); stroke-width: 2; }
.b { font-weight: 700; }
</style>
