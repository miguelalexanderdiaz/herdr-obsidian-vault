<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 332 497" width="332" height="497" role="img" aria-labelledby="t d">
<title id="t">The sample vault in the Vault panel, every folder open</title>
<desc id="d">The Vault panel on examples/sample-vault with every folder open: attachments/, manual.pdf, photo.png, spec.pdf, projects/, a/, plan, b/, plan, Board, Feature tour, Flow sketch, Other note. Each kind has its icon: notes, a canvas, an Excalidraw drawing, images and PDFs. Drawn from the mods' own layout code, icons and the Herdr graphite theme, with the sample vault's content; a drawing, not a screenshot.</desc>
